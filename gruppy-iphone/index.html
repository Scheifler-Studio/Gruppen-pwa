<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f5fa"><meta name="apple-mobile-web-app-capable" content="yes"><title>Группы</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-180.png"><link rel="stylesheet" href="styles.css?v=23"></head><body><main class="screen"><header><img class="brand-icon" src="icon.svg" alt="" aria-hidden="true"><h1>Группы</h1></header><div id="login" class="panel"><h2>Регистрация</h2><p>Введите временный код.</p><form id="loginForm"><div class="code-entry"><div class="code-boxes" role="group" aria-label="Четырёхзначный временный код"><input class="code-digit" inputmode="numeric" type="text" pattern="[0-9]" maxlength="1" autocomplete="one-time-code" aria-label="Первая цифра" placeholder="•"><input class="code-digit" inputmode="numeric" type="text" pattern="[0-9]" maxlength="1" aria-label="Вторая цифра" placeholder="•"><input class="code-digit" inputmode="numeric" type="text" pattern="[0-9]" maxlength="1" aria-label="Третья цифра" placeholder="•"><input class="code-digit" inputmode="numeric" type="text" pattern="[0-9]" maxlength="1" aria-label="Четвёртая цифра" placeholder="•"></div><input name="code" type="hidden" id="joinedCode"></div><button class="primary">Отправить</button></form></div><div id="pending" class="panel" hidden><h2>Код отправлен</h2><p id="pendingText">Ваш код отправлен. Ожидайте подтверждения.</p><div class="pending-animation" aria-hidden="true"></div><button id="check" class="secondary-action">Проверить сейчас</button></div><div id="active" hidden>
  <div class="active-toolbar"><button id="calendarToggle" class="toolbar-icon calendar-app" aria-label="Выбрать отчётный месяц" title="Выбрать отчётный месяц"><span class="calendar-face" aria-hidden="true"><span id="todayMonth" class="calendar-face-month"></span><span id="todayDay" class="calendar-face-day"></span></span></button><div id="periodLabel" class="period-label"></div><button id="gear" class="toolbar-icon" aria-label="Настройки группы" title="Настройки группы"><svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 14 4l2.5-.5 1.3 2.4 2.5 1v2.8l1.5 2.3-1.5 2.3v2.8l-2.5 1-1.3 2.4-2.5-.5-2 1.5-2-1.5-2.5.5-1.3-2.4-2.5-1v-2.8L2 12l1.5-2.3V6.9l2.5-1 1.3-2.4L9.8 4z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <section id="monthPanel" class="month-panel" hidden><h3>Выбрать месяц</h3><div id="monthChoices" class="month-choices"></div></section>
  <section id="groupSettings" class="group-settings" hidden><button id="reorderToggle" type="button">Изменить порядок участников</button><button id="notifyToggle" type="button">Разрешить уведомления</button><button id="aboutApp" type="button">О программе</button></section>
  <h2 class="group-title">Группа <span id="groupName"></span></h2>
  <div id="monthReminder" class="month-reminder" hidden>Наступило время собирать отчёты</div>
  <input type="hidden" id="month"><div id="members"></div>
  <div class="add-footer"><button id="addMember" class="plus-circle" aria-label="Добавить участника">+</button><div>Добавить участника</div></div>
</div><div id="notice" class="notice" hidden></div></main><div id="overlay" class="overlay" hidden><section class="sheet"><div class="sheet-head"><h2 id="formTitle">Отчёт</h2><button id="close" aria-label="Закрыть">×</button></div><div id="formBody"></div></section></div><script src="config.js?v=23"></script><script src="bridge-client.js?v=23"></script><script src="app.js?v=23" defer></script></body></html>

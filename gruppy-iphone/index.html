<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e6effb"><meta name="apple-mobile-web-app-capable" content="yes"><title>Группы — Отчёты</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css?v=2"></head><body><main class="screen"><header><div><h1>Группы</h1><p id="subtitle">Отчёты участников</p></div><button id="refresh" title="Обновить">↻</button></header><div id="login" class="panel"><h2>Регистрация</h2><p>Введи временный код, выданный секретарём.</p><form id="loginForm"><label>Введи временный код<input name="code" type="text" inputmode="numeric" pattern="[0-9]{4,5}" minlength="4" maxlength="5" required placeholder="4–5 цифр"></label><button class="primary">Отправить секретарю</button></form></div><div id="pending" class="panel" hidden><h2>Ожидается подтверждение</h2><p id="pendingText">Секретарь должен подтвердить регистрацию на iPad.</p><button id="check" class="primary">Проверить</button></div><div id="active" hidden><section class="filter"><label>Отчёт за месяц<input type="month" id="month"></label><p>По умолчанию показывается прошедший месяц.</p></section><div id="members"></div></div><div id="notice" class="notice" hidden></div></main><div id="overlay" class="overlay" hidden><section class="sheet"><div class="sheet-head"><h2 id="formTitle">Отчёт</h2><button id="close" aria-label="Закрыть">×</button></div><div id="formBody"></div></section></div><script src="config.js?v=2"></script><script src="app.js?v=2" defer></script></body></html>

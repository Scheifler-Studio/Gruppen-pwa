<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f5fa"><meta name="apple-mobile-web-app-capable" content="yes"><title>Группы</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-180.png"><link rel="stylesheet" href="styles.css?v=6"></head><body><main class="screen"><header><img class="brand-icon" src="icon.svg" alt="" aria-hidden="true"><h1>Группы</h1></header><div id="login" class="panel"><h2>Регистрация</h2><p>Введите временный код.</p><form id="loginForm"><div class="code-entry"><div class="code-boxes" role="group" aria-label="Четырёхзначный временный код"><input class="code-digit" inputmode="numeric" type="text" pattern="[0-9]" maxlength="1" autocomplete="one-time-code" aria-label="Первая цифра" placeholder="•"><input class="code-digit" inputmode="numeric" type="text" pattern="[0-9]" maxlength="1" aria-label="Вторая цифра" placeholder="•"><input class="code-digit" inputmode="numeric" type="text" pattern="[0-9]" maxlength="1" aria-label="Третья цифра" placeholder="•"><input class="code-digit" inputmode="numeric" type="text" pattern="[0-9]" maxlength="1" aria-label="Четвёртая цифра" placeholder="•"></div><input name="code" type="hidden" id="joinedCode"></div><button class="primary">Отправить</button></form></div><div id="pending" class="panel" hidden><h2>Ожидается подтверждение</h2><p id="pendingText">Секретарь должен подтвердить регистрацию на iPad.</p><button id="check" class="primary">Проверить</button></div><div id="active" hidden><section class="filter"><label>Отчёт за месяц<input type="month" id="month"></label><p>По умолчанию показывается прошедший месяц.</p></section><div id="members"></div></div><div id="notice" class="notice" hidden></div></main><div id="overlay" class="overlay" hidden><section class="sheet"><div class="sheet-head"><h2 id="formTitle">Отчёт</h2><button id="close" aria-label="Закрыть">×</button></div><div id="formBody"></div></section></div><script src="config.js?v=6"></script><script src="bridge-client.js?v=6"></script><script src="app.js?v=6" defer></script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9eef5"><meta name="apple-mobile-web-app-capable" content="yes"><title>Группы — Секретарь</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css?v=11"></head><body>
<div class="app"><aside class="sidebar"><div class="side-heading"><span>Группы</span><button id="foldGroups" class="chev" title="Раскрыть группы">›</button></div><nav id="groupNav" hidden></nav><div class="side-spacer"></div><div class="report-zone"><div class="report-title"><button id="toggleReports" class="report-toggle">Отчёты <span id="reportArrow">›</span></button></div><div id="reportContent" hidden><label>Месяц <input id="reportMonth" type="month"></label><div class="report-row"><span>APV</span><b id="sumAPV">0</b></div><div class="report-row"><span>HPV</span><b id="sumHPV">0</b></div><div class="report-row"><span>V</span><b id="sumV">0</b></div><div class="report-row"><span>UV</span><b id="sumUV">0</b></div><div class="report-row total"><span>Всего:</span><b id="sumAll">0</b></div></div></div><button id="settings" class="settings">⚙ Настройки</button><div class="version">Версия iPad 11.0</div></aside>
<main><header class="topbar"><h1 id="title">Участники</h1><input id="search" type="search" placeholder="Поиск участников…"><span id="sync">Не подключено</span><div class="add-wrap"><button id="addBtn" class="add" aria-label="Добавить">+</button><div id="addMenu" hidden><button data-add="group">+ Группа</button><button data-add="member">+ Участник</button></div></div></header><div class="toolbar"><span id="count">Все группы · 0</span><span class="toolbar-right">Группа <select id="filterGroup"><option value="all">Все группы</option></select> Сортировка <select id="sort"><option value="az">Фамилия: А–Я</option><option value="za">Фамилия: Я–А</option><option value="date">Дата добавления</option></select></span></div><section id="pending" class="pending" hidden></section><div id="list" class="members"></div></main></div>
<div id="backdrop" class="backdrop" hidden><section class="dialog" role="dialog" aria-modal="true"><header><h2 id="dialogTitle">Карточка участника</h2><button id="close" class="close" title="Закрыть">×</button></header><div id="dialogBody" class="dialog-body"></div></section></div><div id="toast" class="toast" hidden></div><script src="app.js?v=11" defer></script></body></html>
